
spring:
  application:
    name: ms-courier-service
  datasource:
    url: jdbc:postgresql://localhost:5433/courier-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8083
  address: localhost